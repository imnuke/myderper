services:
  caddy:
    image: ghcr.io/caddybuilds/caddy-cloudflare:${CADDY_VERSION:-2.11.2}
    container_name: derp-caddy
    restart: unless-stopped
    environment:
      CF_API_TOKEN: ${CLOUDFLARE_API_TOKEN}
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test:
        - CMD
        - test
        - -f
        - /data/caddy/certificates/acme-v02.api.letsencrypt.org-directory/${DOMAIN}/${DOMAIN}.crt
      interval: 10s
      timeout: 3s
      retries: 60
      start_period: 15s

  tailscaled:
    image: tailscale/tailscale:latest
    container_name: tailscaled
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY}
      TS_USERSPACE: "true"
      TS_SOCKET: /var/run/tailscale/tailscaled.sock
      TS_STATE_DIR: /var/lib/tailscale
    volumes:
      - ts_state:/var/lib/tailscale
      - tailscale-run:/var/run/tailscale
    healthcheck:
      test: ["CMD", "test", "-S", "/var/run/tailscale/tailscaled.sock"]
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  derper:
    image: fredliang/derper:latest
    container_name: myderp
    depends_on:
      caddy:
        condition: service_healthy
      tailscaled:
        condition: service_healthy
    ports:
      - "443:443/tcp"
      - "9443:443/tcp"
      - "3478:3478/udp"
    environment:
      DERP_DOMAIN: ${DOMAIN}
      DERP_CERT_MODE: manual
      DERP_VERIFY_CLIENTS: "true"
      DERP_CERT_DIR: /caddy-data/caddy/certificates/acme-v02.api.letsencrypt.org-directory/${DOMAIN}
    volumes:
      - caddy_data:/caddy-data:ro
      - tailscale-run:/var/run/tailscale:ro
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
  ts_state:
  tailscale-run:

networks:
  default:
    enable_ipv6: true
    ipam:
      config:
        - subnet: "fd8a:7c2b:9e10:1::/64"
