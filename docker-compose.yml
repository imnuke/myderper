services:
  tailscaled:
    image: tailscale/tailscale:${TAILSCALE_VERSION:-v1.96.5}
    container_name: tailscaled
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY}
      TS_HOSTNAME: derper-verifier
      TS_USERSPACE: "true"
      TS_SOCKET: /var/run/tailscale/tailscaled.sock
      TS_STATE_DIR: /var/lib/tailscale
    volumes:
      - ts_state:/var/lib/tailscale
      - tailscale-run:/var/run/tailscale
    healthcheck:
      test: ["CMD", "test", "-S", "/var/run/tailscale/tailscaled.sock"]
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  derper:
    build:
      context: ./derper
      args:
        DERPER_REF: ${DERPER_VERSION:-v1.96.5}
    image: myderper/derper:${DERPER_VERSION:-v1.96.5}
    container_name: myderp
    depends_on:
      tailscaled:
        condition: service_healthy
    ports:
      - "443:443/tcp"
      - "9443:443/tcp"
      - "3478:3478/udp"
    command:
      # --hostname must be an IP literal to trigger noHostname mode in
      # cmd/derper/cert.go, which is required so derper accepts the
      # sha256-raw:... SNI that cert-pinning tailscale clients send.
      # The client-facing address is set by HostName in the tailnet derpMap,
      # not here. 127.0.0.1 is just a placeholder that parses as an IP.
      - -a=:443
      - -hostname=127.0.0.1
      - -certmode=manual
      - -certdir=/certs
      - -stun=true
      - -verify-clients=true
      - -http-port=-1
    volumes:
      - ./certs:/certs:ro
      - tailscale-run:/var/run/tailscale:ro
    restart: unless-stopped

volumes:
  ts_state:
  tailscale-run:

networks:
  default:
    enable_ipv6: true
    ipam:
      config:
        - subnet: "fd8a:7c2b:9e10:1::/64"
